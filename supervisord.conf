[supervisord]
nodaemon=true ; تشغيل Supervisord في المقدمة، ضروري لـ Docker

[program:php-script]
command=/usr/local/bin/php /app/index.php ; المسار الكامل لـ PHP والسكريبت
directory=/app ; مجلد العمل للسكريبت
user=www-data ; تشغيل السكريبت كمستخدم www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout ; إرسال المخرجات القياسية إلى سجلات Docker
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr ; إرسال مخرجات الخطأ إلى سجلات Docker
stderr_logfile_maxbytes=0

[program:gunicorn]
; تأكد من أن 'app:app' صحيح لملف وتطبيق Python الخاص بك
command=/usr/local/bin/gunicorn --bind 0.0.0.0:8000 app:app
directory=/app ; مجلد العمل لـ Gunicorn
user=www-data ; تشغيل Gunicorn كمستخدم www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout ; إرسال المخرجات القياسية إلى سجلات Docker
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr ; إرسال مخرجات الخطأ إلى سجلات Docker
stderr_logfile_maxbytes=0

; ملاحظة: قد تحتاج إلى تعديل المسارات /usr/local/bin/php و /usr/local/bin/gunicorn
; إذا كانت مثبتة في مكان مختلف. يمكنك التحقق منها داخل الحاوية باستخدام `which php` و `which gunicorn`
